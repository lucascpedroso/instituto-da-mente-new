# Pré-visualização estática do site no GitHub Pages.
# O site oficial (com formulários, banco e /admin) é publicado na Hostinger via deploy.sh.
# Requer: Settings › Pages › Source = "GitHub Actions".
name: Pré-visualização (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, pdo_sqlite, zip, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Build dos assets com o caminho do Pages
        run: ASSET_URL="$PREVIEW_URL" npm run build

      - name: Banco temporário com o conteúdo inicial
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force

      - name: Testes
        run: php artisan test --compact

      - name: Exportar HTML estático
        run: php artisan app:export-static --url="$PREVIEW_URL" --out=dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
